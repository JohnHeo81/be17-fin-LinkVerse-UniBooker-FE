name: 🚀 UniBooker 프론트엔드 배포

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  DOCKER_IMAGE: johnheo81/unibooker-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📢 배포 시작 알림
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🚀 프론트엔드 배포 시작",
                "description": "UniBooker FE 배포가 시작되었습니다.",
                "color": 3447003,
                "fields": [
                  {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                  {"name": "By", "value": "${{ github.actor }}", "inline": true}
                ]
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 📦 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔨 npm install & build
        run: |
          npm ci
          npm run build

      - name: 🐳 Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: 🚀 EC2 배포 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/frontend

            # 기존 컨테이너 정리
            docker stop unibooker-fe || true
            docker rm unibooker-fe || true

            # 이전 이미지 및 캐시 정리
            docker system prune -af --volumes
            docker builder prune -af

            # Docker Hub에서 이미지 Pull
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            # 컨테이너 실행
            docker run -d \
              --name unibooker-fe \
              -p 80:80 \
              --restart unless-stopped \
              ${{ env.DOCKER_IMAGE }}:latest

            # 헬스체크
            echo "⏳ 헬스체크 시작..."
            for i in {1..12}; do
              if curl -s http://localhost:80 | grep -q "html"; then
                echo "✅ 서버 정상 구동!"
                exit 0
              fi
              echo "대기 중... ($i/12)"
              sleep 5
            done

            echo "❌ 헬스체크 실패"
            exit 1

      - name: ✅ 배포 성공 알림
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ 프론트엔드 배포 성공",
                "description": "UniBooker FE 배포가 완료되었습니다!",
                "color": 3066993,
                "fields": [
                  {"name": "환경", "value": "Production", "inline": true},
                  {"name": "이미지", "value": "${{ env.DOCKER_IMAGE }}:${{ github.sha }}", "inline": false}
                ]
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: ❌ 배포 실패 알림
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ 프론트엔드 배포 실패",
                "description": "UniBooker FE 배포에 실패했습니다!",
                "color": 15158332,
                "fields": [
                  {"name": "로그 확인", "value": "[GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}
                ]
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}